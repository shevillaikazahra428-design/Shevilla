<!DOCTYPE html>
<html>
<head>
    <title>Data Pendaftar</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg,#4f46e5,#06b6d4);
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            text-align: center;
        }
        .data {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        button {
            background: #4f46e5;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📋 Data Pendaftar</h2>
        <div class="data">
            <p><strong>Nama Depan:</strong> <span id="displayDepan"></span></p>
            <p><strong>Nama Belakang:</strong> <span id="displayBelakang"></span></p>
        </div>
        <button onclick="location.href='form.html'">Kembali ke Form</button>
    </div>

    <script>
        // Ambil data dari URL
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('displayDepan').innerHTML = urlParams.get('namaDepan');
        document.getElementById('displayBelakang').innerHTML = urlParams.get('namaBelakang');
    </script>
</body>
</html>
