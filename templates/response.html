<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demo Text</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fce4ec;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    .bg-svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .card {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.95);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      position: relative;
      z-index: 2;
      box-shadow: 0 8px 32px rgba(183,91,136,0.15);
      text-align: center;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 1rem;
    }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 600;
      color: #8b3a6b;
      margin-bottom: 1rem;
    }
    .greeting {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      color: #5a2d4e;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .nama {
      color: #c06fa0;
      font-weight: 500;
    }
    .btn-back {
      display: inline-block;
      padding: 11px 28px;
      background: #c06fa0;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-back:hover { opacity: 0.88; }
  </style>
</head>
<body>

<svg class="bg-svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <g opacity=".9">
    <ellipse cx="100" cy="110" rx="22" ry="30" fill="#f48fb1" transform="rotate(-20,100,110)"/>
    <ellipse cx="135" cy="88" rx="22" ry="30" fill="#f06292" transform="rotate(20,135,88)"/>
    <ellipse cx="155" cy="122" rx="22" ry="30" fill="#f48fb1" transform="rotate(70,155,122)"/>
    <ellipse cx="128" cy="150" rx="22" ry="30" fill="#ec407a" transform="rotate(130,128,150)"/>
    <ellipse cx="90" cy="142" rx="22" ry="30" fill="#f06292" transform="rotate(-70,90,142)"/>
    <circle cx="122" cy="120" r="13" fill="#fce4ec"/>
    <circle cx="122" cy="120" r="6" fill="#f8bbd0"/>
    <line x1="120" y1="190" x2="122" y2="120" stroke="#a5d6a7" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g opacity=".88">
    <ellipse cx="1270" cy="80" rx="20" ry="27" fill="#ce93d8" transform="rotate(-15,1270,80)"/>
    <ellipse cx="1300" cy="60" rx="20" ry="27" fill="#ba68c8" transform="rotate(25,1300,60)"/>
    <ellipse cx="1318" cy="88" rx="20" ry="27" fill="#ce93d8" transform="rotate(75,1318,88)"/>
    <ellipse cx="1298" cy="112" rx="20" ry="27" fill="#ab47bc" transform="rotate(135,1298,112)"/>
    <ellipse cx="1265" cy="104" rx="20" ry="27" fill="#ba68c8" transform="rotate(-65,1265,104)"/>
    <circle cx="1291" cy="88" r="12" fill="#f3e5f5"/>
    <circle cx="1291" cy="88" r="5" fill="#e1bee7"/>
    <line x1="1290" y1="160" x2="1291" y2="88" stroke="#a5d6a7" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g opacity=".82">
    <ellipse cx="120" cy="780" rx="20" ry="28" fill="#ce93d8" transform="rotate(-25,120,780)"/>
    <ellipse cx="150" cy="758" rx="20" ry="28" fill="#ab47bc" transform="rotate(15,150,758)"/>
    <ellipse cx="165" cy="784" rx="20" ry="28" fill="#ce93d8" transform="rotate(65,165,784)"/>
    <ellipse cx="146" cy="806" rx="20" ry="28" fill="#9c27b0" transform="rotate(125,146,806)"/>
    <ellipse cx="114" cy="798" rx="20" ry="28" fill="#ab47bc" transform="rotate(-75,114,798)"/>
    <circle cx="141" cy="781" r="12" fill="#f3e5f5"/>
    <circle cx="141" cy="781" r="5" fill="#e1bee7"/>
    <line x1="140" y1="720" x2="141" y2="781" stroke="#a5d6a7" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g opacity=".85">
    <ellipse cx="1250" cy="790" rx="22" ry="30" fill="#f48fb1" transform="rotate(-10,1250,790)"/>
    <ellipse cx="1282" cy="768" rx="22" ry="30" fill="#ec407a" transform="rotate(30,1282,768)"/>
    <ellipse cx="1298" cy="796" rx="22" ry="30" fill="#f48fb1" transform="rotate(80,1298,796)"/>
    <ellipse cx="1274" cy="820" rx="22" ry="30" fill="#e91e8c" transform="rotate(140,1274,820)"/>
    <ellipse cx="1242" cy="812" rx="22" ry="30" fill="#ec407a" transform="rotate(-60,1242,812)"/>
    <circle cx="1268" cy="796" r="13" fill="#fce4ec"/>
    <circle cx="1268" cy="796" r="6" fill="#f8bbd0"/>
    <line x1="1268" y1="728" x2="1268" y2="796" stroke="#a5d6a7" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <circle cx="380" cy="560" r="5" fill="#f48fb1" opacity=".45"/>
  <circle cx="950" cy="200" r="4" fill="#ce93d8" opacity=".4"/>
  <circle cx="220" cy="650" r="6" fill="#f06292" opacity=".35"/>
  <circle cx="1100" cy="650" r="5" fill="#ab47bc" opacity=".38"/>
</svg>

<div class="card">
  <div class="icon">🌸</div>
  <h2 class="card-title">Demo Text</h2>
  <p class="greeting">
    Halo, <span class="nama">{{ nama }}</span>!<br/>
    Selamat datang di pemrograman Python.
  </p>
  <a href="/" class="btn-back">Kembali</a>
</div>

</body>
</html>
