<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demo Text</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fce4ec;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .bg-svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .card {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.95);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      position: relative;
      z-index: 2;
      box-shadow: 0 8px 32px rgba(183,91,136,0.15);
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 600;
      color: #8b3a6b;
      text-align: center;
      margin-bottom: 4px;
    }

    .card-sub {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: #c06fa0;
      text-align: center;
      margin-bottom: 1.8rem;
      letter-spacing: 0.5px;
    }

    label {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: #9b4d7a;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: block;
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 15px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: #5a2d4e;
      background: rgba(255,255,255,0.85);
      border: 1.5px solid rgba(183,91,136,0.2);
      border-radius: 12px;
      outline: none;
      margin-bottom: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: #c06fa0;
      box-shadow: 0 0 0 3px rgba(192,111,160,0.15);
    }

    button {
      width: 100%;
      padding: 13px;
      background: #c06fa0;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.88; }
    button:active { transform: scale(0.98); }

    .result {
      margin-top: 1rem;
      padding: 11px 15px;
      background: rgba(183,91,136,0.1);
      border: 1px dashed rgba(183,91,136,0.35);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: #8b3a6b;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

</svg>

<div class="card">
  <p class="card-title">Demo Text</p>
  <p class="card-sub">Masukkan nama lengkap kamu ✦</p>

  <label for="namaDepan">Nama depan:</label>
  <input type="text" id="namaDepan" value="Shevilla" placeholder="Nama depan..."/>

  <label for="namaBelakang">Nama belakang:</label>
  <input type="text" id="namaBelakang" value="Zahra" placeholder="Nama belakang..."/>

  <button onclick="kirim()">Kirim</button>
  <div class="result" id="result"></div>
</div>

<script>
  function kirim() {
    const fn = document.getElementById('namaDepan').value.trim();
    const ln = document.getElementById('namaBelakang').value.trim();
    const box = document.getElementById('result');
    if (fn || ln) {
      box.style.display = 'block';
      box.textContent = 'Halo, ' + [fn, ln].filter(Boolean).join(' ') + '!';
    }
  }
</script>

</body>
</html>
